<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auto Web Builder & Code Generator</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip & FileSaver สำหรับทำไฟล์ ZIP บนเบราว์เซอร์ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-3">
            <div class="bg-teal-500 p-2 rounded-lg text-gray-900">
                <i data-lucide="cpu" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-teal-400 to-emerald-400 bg-clip-text text-transparent">AI WebCrafter</h1>
                <p class="text-xs text-gray-400">ระบบสร้างเว็บไซต์อัตโนมัติด้วย AI</p>
            </div>
        </div>
        <button onclick="downloadZip()" class="bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-gray-900 font-bold py-2.5 px-5 rounded-xl flex items-center gap-2 transition transform active:scale-95 shadow-md">
            <i data-lucide="download-cloud" class="w-5 h-5"></i>
            ดาวน์โหลดไฟล์ ZIP
        </button>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Left Side: Controller -->
        <div class="w-2/5 p-6 border-r border-gray-800 bg-gray-900/50 flex flex-col gap-6 overflow-y-auto">
            
            <!-- Checkbox Options -->
            <div>
                <label class="block text-sm font-semibold mb-3 text-teal-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4"></i> 1. ติ๊กเลือกฟีเจอร์พื้นฐาน
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-3 p-3.5 bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-750 border border-gray-700/50 transition">
                        <input type="checkbox" id="feat-nav" class="w-4 h-4 rounded text-teal-500 focus:ring-0 accent-teal-500" checked>
                        <span class="text-sm">แถบเมนู (Navbar)</span>
                    </label>
                    <label class="flex items-center gap-3 p-3.5 bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-750 border border-gray-700/50 transition">
                        <input type="checkbox" id="feat-hero" class="w-4 h-4 rounded text-teal-500 focus:ring-0 accent-teal-500" checked>
                        <span class="text-sm">แบนเนอร์หน้าแรก</span>
                    </label>
                    <label class="flex items-center gap-3 p-3.5 bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-750 border border-gray-700/50 transition">
                        <input type="checkbox" id="feat-contact" class="w-4 h-4 rounded text-teal-500 focus:ring-0 accent-teal-500">
                        <span class="text-sm">ฟอร์มติดต่อเรา</span>
                    </label>
                    <label class="flex items-center gap-3 p-3.5 bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-750 border border-gray-700/50 transition">
                        <input type="checkbox" id="feat-footer" class="w-4 h-4 rounded text-teal-500 focus:ring-0 accent-teal-500" checked>
                        <span class="text-sm">ส่วนท้ายเว็บ (Footer)</span>
                    </label>
                </div>
            </div>

            <!-- Thai Text Prompt Input -->
            <div class="flex-1 flex flex-col">
                <label class="block text-sm font-semibold mb-3 text-teal-400 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="message-square-code" class="w-4 h-4"></i> 2. อธิบายสไตล์และเนื้อหาเว็บ (ภาษาไทย)
                </label>
                <textarea id="prompt-input" class="w-full flex-1 p-4 bg-gray-800 border border-gray-700 rounded-xl focus:ring-2 focus:ring-teal-500 focus:outline-none text-white placeholder-gray-500 resize-none shadow-inner text-sm leading-relaxed" placeholder="ตัวอย่าง: อยากได้หน้าแรกของร้านกาแฟมินิมอล โทนสีครีมและน้ำตาลอ่อน มีตารางเมนูเครื่องดื่มยอดฮิต 3 อย่าง และปุ่มสีส้มเด่นๆ เขียนว่า 'ดูเมนูทั้งหมด'"></textarea>
            </div>

            <!-- Generate Button -->
            <button onclick="generateWeb()" id="gen-btn" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-gray-900 font-bold py-4 rounded-xl transition text-base shadow-lg shadow-teal-500/10 flex items-center justify-center gap-2 transform active:scale-[0.99]">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span id="btn-text">เริ่มสร้างเว็บอัตโนมัติ</span>
            </button>
        </div>

        <!-- Right Side: Preview & Code View -->
        <div class="w-3/5 flex flex-col bg-gray-950">
            <!-- Tabs Navigation -->
            <div class="flex border-b border-gray-800 bg-gray-900/80 backdrop-blur">
                <button onclick="switchTab('preview')" id="tab-preview-btn" class="px-6 py-3.5 border-b-2 border-teal-500 text-teal-400 font-medium text-sm flex items-center gap-2 transition">
                    <i data-lucide="eye" class="w-4 h-4"></i> หน้าเว็บจริง (Preview)
                </button>
                <button onclick="switchTab('code')" id="tab-code-btn" class="px-6 py-3.5 border-b-2 border-transparent text-gray-400 font-medium text-sm flex items-center gap-2 transition">
                    <i data-lucide="code-2" class="w-4 h-4"></i> ดูโค้ด (Source Code)
                </button>
            </div>

            <!-- View Sandbox -->
            <div class="flex-1 relative">
                <!-- Loader -->
                <div id="loader" class="absolute inset-0 bg-gray-950/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center gap-4 hidden">
                    <div class="w-12 h-12 border-4 border-teal-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-teal-400 font-medium animate-pulse">AI กำลังวิเคราะห์ภาษาไทยและเขียนโค้ด...</p>
                </div>

                <!-- Web Live Preview View (Iframe) -->
                <iframe id="web-preview" class="w-full h-full bg-white"></iframe>
                
                <!-- Code Editor View (Code Container) -->
                <pre id="code-view" class="w-full h-full p-6 overflow-auto text-xs font-mono text-emerald-400 bg-gray-950 hidden selection:bg-teal-500/20"></pre>
            </div>
        </div>

    </div>

    <script>
        // เรียกใช้ไอคอนดั้งเดิม
        lucide.createIcons();

        let currentCode = "";

        function switchTab(tab) {
            const previewEl = document.getElementById('web-preview');
            const codeEl = document.getElementById('code-view');
            const previewBtn = document.getElementById('tab-preview-btn');
            const codeBtn = document.getElementById('tab-code-btn');

            if (tab === 'preview') {
                previewEl.classList.remove('hidden');
                codeEl.classList.add('hidden');
                previewBtn.className = "px-6 py-3.5 border-b-2 border-teal-500 text-teal-400 font-medium text-sm flex items-center gap-2 transition";
                codeBtn.className = "px-6 py-3.5 border-b-2 border-transparent text-gray-400 font-medium text-sm flex items-center gap-2 transition";
            } else {
                previewEl.classList.add('hidden');
                codeEl.classList.remove('hidden');
                previewBtn.className = "px-6 py-3.5 border-b-2 border-transparent text-gray-400 font-medium text-sm flex items-center gap-2 transition";
                codeBtn.className = "px-6 py-3.5 border-b-2 border-teal-500 text-teal-400 font-medium text-sm flex items-center gap-2 transition";
            }
        }

        // ฟังก์ชันส่งข้อมูลไปหา Backend เพื่อเรียก OpenAI API
        async function generateWeb() {
            const prompt = document.getElementById('prompt-input').value;
            if(!prompt.trim()) {
                alert("กรุณากรอกความต้องการภาษาไทยก่อนครับ");
                return;
            }

            const features = {
                navbar: document.getElementById('feat-nav').checked,
                hero: document.getElementById('feat-hero').checked,
                contactForm: document.getElementById('feat-contact').checked,
                footer: document.getElementById('feat-footer').checked,
            };

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('gen-btn').disabled = true;

            try {
                const response = await fetch('http://localhost:3000/api/generate-web', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, features })
                });

                const data = await response.json();
                
                if (data.success) {
                    currentCode = data.code;
                    document.getElementById('web-preview').srcdoc = currentCode;
                    document.getElementById('code-view').innerText = currentCode;
                    switchTab('preview');
                } else {
                    alert("เกิดข้อผิดพลาดจาก AI: " + data.message);
                }
            } catch (error) {
                console.error(error);
                alert("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์หลังบ้านได้ กรุณาตรวจสอบว่าเปิดเซิร์ฟเวอร์หรือยัง");
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('gen-btn').disabled = false;
            }
        }

        function downloadZip() {
            if (!currentCode) {
                alert("ยังไม่มีโค้ดให้ดาวน์โหลด กรุณาสั่งให้ AI สร้างโค้ดก่อนครับ");
                return;
            }
            const zip = new JSZip();
            zip.file("index.html", currentCode);
            
            zip.generateAsync({type:"blob"}).then(function(content) {
                saveAs(content, "ai-generated-website.zip");
            });
        }
    </script>
</body>
</html>
